name: Refresh profile visuals

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/render-featured-work.mjs"
      - ".github/workflows/profile-visuals.yml"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Render selected public work
        run: node .github/scripts/render-featured-work.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render contribution trail
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-trail-light.svg?palette=github-light&color_snake=#c27c0e&color_dots=#ebedf0,#d7efd9,#9ed6a5,#57a773,#2e6f49
            assets/contribution-trail-dark.svg?palette=github-dark&color_snake=#e3a857&color_dots=#161b22,#1f3b2d,#2f6e49,#47a46b,#74d99a

      - name: Publish refreshed visuals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$(mktemp)"
          rm "$GIT_INDEX_FILE"
          git add assets/
          visuals_tree="$(git write-tree)"
          visuals_commit="$(printf '%s\n' 'Refresh profile visuals' | git commit-tree "$visuals_tree")"
          git push --force origin "$visuals_commit:refs/heads/visuals"
